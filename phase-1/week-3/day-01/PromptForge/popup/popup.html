<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PromptForge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-shell">
    <header class="popup-header"><div class="mark">✳</div><div><strong>PromptForge</strong><small>ICEPOT PROMPT WORKSPACE</small></div><span class="version">1.1.0</span></header>
    <div class="welcome"><div class="eyebrow">THINK CLEARER. PROMPT BETTER.</div><h1>Make your next prompt<br><span>work harder.</span></h1><p>Transform rough ideas, technical specs, and code into structured, copy-ready ICEPOT prompts.</p></div>
    <div class="mini-flow"><div><b>01</b><span>Analyze</span></div><i></i><div><b>02</b><span>Structure</span></div><i></i><div><b>03</b><span>Export</span></div></div>
    <button id="openWorkspace" class="open-button">Open PromptForge <span>→</span></button>
    <div class="popup-footer"><span id="keyState"><i></i> Checking AI setup…</span><button id="openSettings">Settings</button></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
